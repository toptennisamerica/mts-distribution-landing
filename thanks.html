<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | MTS Aviation Distribution</title>
<meta name="description" content="MTS Aviation Distribution is the North American distributor of InFlight200, JFox, B-Models, White Box Models, Retro Models, ARD200, ARD400, Aviation200 and El Aviador Models. Wholesale for retailers only.">
<link rel="icon" href="https://cdn.shopify.com/s/files/1/0556/0900/0245/files/MTS_Aviation_Distribution_Logo_H.png">
<style>
  :root { --navy:#232f3e; --navy-2:#1a2330; --blue:#3a6fb6; --blue-2:#2d5c9c; --ink:#1d2430; --muted:#5b6675; --line:#e3e7ec; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:#fff; line-height:1.55; }
  a { color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }
  .topbar { background:var(--blue); color:#fff; text-align:center; font-size:13px; letter-spacing:.06em; text-transform:uppercase; padding:8px 12px; }
  .topbar a { color:#fff; font-weight:600; text-decoration:none; }
  header { background:var(--navy); }
  header .wrap { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:14px; padding-bottom:14px; }
  header img { height:62px; width:auto; display:block; }
  .btn { display:inline-block; padding:12px 22px; border-radius:6px; font-weight:600; text-decoration:none; font-size:15px; border:2px solid transparent; transition:background .15s, color .15s; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover { background:var(--blue-2); }
  .btn-light { border-color:#fff; color:#fff; }
  .btn-light:hover { background:#fff; color:var(--navy); }
  .btn-outline { border-color:var(--navy); color:var(--navy); }
  .btn-outline:hover { background:var(--navy); color:#fff; }
  .hero { position:relative; color:#fff; background:var(--navy-2) url("https://cdn.shopify.com/s/files/1/0556/0900/0245/products/us_airways_airbus_a330-323_n678us_navy_blue_livery_with_stand_inflight_if333us0719_scale_1-200.jpg?width=1800") center 60%/cover no-repeat; }
  .hero::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(20,28,40,.92) 0%, rgba(20,28,40,.78) 45%, rgba(20,28,40,.35) 100%); }
  .hero .wrap { position:relative; padding-top:88px; padding-bottom:96px; }
  .hero h1 { font-size:clamp(30px, 4.6vw, 48px); line-height:1.12; margin:0 0 16px; max-width:640px; }
  .hero p { font-size:18px; max-width:560px; margin:0 0 28px; color:#dfe6ef; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; }
  section { padding:64px 0; }
  h2 { font-size:28px; margin:0 0 10px; }
  .lead { color:var(--muted); margin:0 0 32px; max-width:680px; }
  .brands { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .brands img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
  .more { margin-top:18px; color:var(--muted); }
  .more strong { color:var(--ink); }
  .bg { background:var(--bg); }
  .steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
  .step { background:#fff; border:1px solid var(--line); border-radius:10px; padding:22px; }
  .step .n { width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:700; margin-bottom:12px; }
  .step h3 { margin:0 0 6px; font-size:18px; }
  .step p { margin:0; color:var(--muted); }
  .cta { text-align:center; }
  .cta .actions { justify-content:center; margin-top:8px; }
  .form { background:#fff; border:1px solid var(--line); border-radius:10px; padding:28px; max-width:760px; }
  .form .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form .full { grid-column:1 / -1; }
  .form label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .form input, .form select, .form textarea { width:100%; padding:11px 12px; border:1px solid #cdd4dd; border-radius:6px; font:inherit; background:#fff; color:var(--ink); }
  .form input:focus, .form select:focus, .form textarea:focus { outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue); }
  .form .note { font-size:13px; color:var(--muted); margin:14px 0 0; }
  .form button { margin-top:18px; cursor:pointer; }
  .hp { position:absolute; left:-9999px; }
  @media (max-width:760px) { .form .grid { grid-template-columns:1fr; } .form { padding:20px; } }
  footer { background:var(--navy); color:#c9d2de; font-size:14px; }
  footer .wrap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; padding-top:28px; padding-bottom:28px; }
  footer a { color:#fff; }
  @media (max-width:760px) {
    header img { height:46px; }
    .brands { grid-template-columns:repeat(2, 1fr); }
    .steps { grid-template-columns:1fr; }
    .hero .wrap { padding-top:56px; padding-bottom:64px; }
    header .btn { padding:9px 14px; font-size:14px; }
  }
</style>
</head>
<body>
  <header><div class="wrap"><a href="./"><img src="https://cdn.shopify.com/s/files/1/0556/0900/0245/files/MTS_Aviation_Distribution_Logo_HERO_final.png?width=500" alt="MTS Aviation Distribution"></a></div></header>
  <section><div class="wrap" style="text-align:center;padding:40px 20px">
    <h2>Thank you!</h2>
    <p class="lead" style="margin:10px auto 28px">We've received your message and will reply by email soon.</p>
    <a class="btn btn-primary" href="./">Back to MTS Aviation Distribution</a>
  </div></section>
</body></html>
